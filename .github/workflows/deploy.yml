name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shop-demo-ecs-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BASE_PATH: /ww/shop-demo/
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload application and static assets
        run: |
          rsync -e "ssh -p ${{ vars.DEPLOY_PORT }}" -az --delete --exclude .git --exclude .github --exclude node_modules --exclude dist ./ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/"
          rsync -e "ssh -p ${{ vars.DEPLOY_PORT }}" -az --delete dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/dist/"
      - name: Restart API service
        run: ssh -p "${{ vars.DEPLOY_PORT }}" "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "cd '${{ vars.DEPLOY_PATH }}' && pnpm install --prod --frozen-lockfile && sudo systemctl restart shop-demo"
      - name: Verify public health endpoint
        run: curl --fail --retry 5 --retry-delay 3 "http://${{ vars.DEPLOY_HOST }}/ww/shop-demo/api/health"
